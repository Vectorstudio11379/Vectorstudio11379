<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
  <defs>
    <linearGradient id="statsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120826" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <linearGradient id="rankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15">
        <animate attributeName="stop-color" values="#facc15;#ff7eb6;#38bdf8;#facc15" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#c084fc;#facc15;#f97316" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="rankGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    @keyframes fillRank {
      0% { stroke-dashoffset: 280; }
      100% { stroke-dashoffset: 40; }
    }
    .rank-circle {
      stroke-dasharray: 280;
      stroke-dashoffset: 280;
      animation: fillRank 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideRow {
      0% { opacity: 0; transform: translateX(18px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .stat-row {
      opacity: 0;
      animation: slideRow 0.5s ease-out forwards;
    }
  </style>

  <!-- Card Surface -->
  <rect width="460" height="220" rx="16" fill="url(#statsBgGrad)" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1.2" />

  <!-- Window Header -->
  <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="34" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="48" cy="18" r="4.5" fill="#27c93f" />
  <text x="68" y="22" fill="#facc15" font-size="12" font-weight="700" class="mono">⚡ GITHUB STATS &amp; RANK</text>
  <line x1="0" y1="34" x2="460" y2="34" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- LEFT: Rank Ring (Center: 86, 124) -->
  <g transform="translate(86, 124)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8" />
    <circle class="rank-circle" cx="0" cy="0" r="45" fill="none" stroke="url(#rankGrad)" stroke-width="8" stroke-linecap="round" transform="rotate(-90)" filter="url(#rankGlow)" />
    <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="900" class="mono">S+</text>
    <text x="0" y="24" text-anchor="middle" fill="#facc15" font-size="8.5" font-weight="700" letter-spacing="1">THUNDER TIER</text>
  </g>

  <!-- Divider line -->
  <line x1="168" y1="50" x2="168" y2="200" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- RIGHT: Stat Rows -->
  <g class="stat-row" style="animation-delay: 0.2s;" transform="translate(188, 62)">
    <circle cx="6" cy="6" r="3.5" fill="#facc15" />
    <text x="20" y="10" fill="#94a3b8" font-size="12" font-weight="500">Total Contributions</text>
    <text x="250" y="10" text-anchor="end" fill="#ffffff" font-size="13" font-weight="700" class="mono">1,840+</text>
  </g>

  <g class="stat-row" style="animation-delay: 0.4s;" transform="translate(188, 98)">
    <circle cx="6" cy="6" r="3.5" fill="#f97316" />
    <text x="20" y="10" fill="#94a3b8" font-size="12" font-weight="500">Total Stars Earned</text>
    <text x="250" y="10" text-anchor="end" fill="#ffffff" font-size="13" font-weight="700" class="mono">450+</text>
  </g>

  <g class="stat-row" style="animation-delay: 0.6s;" transform="translate(188, 134)">
    <circle cx="6" cy="6" r="3.5" fill="#ff7eb6" />
    <text x="20" y="10" fill="#94a3b8" font-size="12" font-weight="500">Merged Pull Requests</text>
    <text x="250" y="10" text-anchor="end" fill="#ffffff" font-size="13" font-weight="700" class="mono">120+</text>
  </g>

  <g class="stat-row" style="animation-delay: 0.8s;" transform="translate(188, 170)">
    <circle cx="6" cy="6" r="3.5" fill="#38bdf8" />
    <text x="20" y="10" fill="#94a3b8" font-size="12" font-weight="500">Code Quality &amp; Uptime</text>
    <text x="250" y="10" text-anchor="end" fill="#38bdf8" font-size="13" font-weight="700" class="mono">99.9% (A+)</text>
  </g>
</svg>