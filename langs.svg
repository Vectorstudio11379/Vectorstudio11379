<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
  <defs>
    <linearGradient id="langsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120826" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Language Gradients -->
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" /><stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" /><stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="otherGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    /* Bar growth animations */
    @keyframes growPy { from { width: 0; } to { width: 140px; } }
    @keyframes growJs { from { width: 0; } to { width: 105px; } }
    @keyframes growReact { from { width: 0; } to { width: 70px; } }
    @keyframes growHtml { from { width: 0; } to { width: 38px; } }
    @keyframes growOther { from { width: 0; } to { width: 22px; } }

    .bar-py { animation: growPy 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-js { animation: growJs 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-react { animation: growReact 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-html { animation: growHtml 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-other { animation: growOther 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <!-- Card Surface -->
  <rect width="460" height="220" rx="16" fill="url(#langsBgGrad)" stroke="rgba(168, 85, 247, 0.28)" stroke-width="1.2" />

  <!-- Window Header -->
  <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="34" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="48" cy="18" r="4.5" fill="#27c93f" />
  <text x="68" y="22" fill="#e2e8f0" font-size="12" font-weight="700" class="mono">🚀 MOST USED LANGUAGES</text>
  <line x1="0" y1="34" x2="460" y2="34" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Progress Bar Container (Stacked) -->
  <g transform="translate(24, 56)">
    <!-- Background track -->
    <rect width="412" height="12" rx="6" fill="rgba(255, 255, 255, 0.08)" />
    <!-- Stacked bars -->
    <rect x="0" y="0" height="12" rx="6" fill="url(#pyGrad)" class="bar-py" />
    <rect x="143" y="0" height="12" rx="6" fill="url(#jsGrad)" class="bar-js" />
    <rect x="251" y="0" height="12" rx="6" fill="url(#reactGrad)" class="bar-react" />
    <rect x="324" y="0" height="12" rx="6" fill="url(#htmlGrad)" class="bar-html" />
    <rect x="365" y="0" height="12" rx="6" fill="url(#otherGrad)" class="bar-other" />
  </g>

  <!-- Language List Grid (2 columns) -->
  <!-- Col 1 -->
  <g transform="translate(24, 95)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4.5" fill="#3b82f6" />
      <text x="18" y="10" fill="#f1f5f9" font-size="12" font-weight="600">Python</text>
      <text x="130" y="10" fill="#94a3b8" font-size="11.5" font-weight="500" class="mono">38.0%</text>
    </g>
    <!-- JavaScript / TS -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="4.5" fill="#f59e0b" />
      <text x="18" y="10" fill="#f1f5f9" font-size="12" font-weight="600">JavaScript / TS</text>
      <text x="130" y="10" fill="#94a3b8" font-size="11.5" font-weight="500" class="mono">28.5%</text>
    </g>
    <!-- React / Next -->
    <g transform="translate(0, 64)">
      <circle cx="6" cy="6" r="4.5" fill="#06b6d4" />
      <text x="18" y="10" fill="#f1f5f9" font-size="12" font-weight="600">React / Next.js</text>
      <text x="130" y="10" fill="#94a3b8" font-size="11.5" font-weight="500" class="mono">18.5%</text>
    </g>
  </g>

  <!-- Col 2 -->
  <g transform="translate(240, 95)">
    <!-- HTML & CSS -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4.5" fill="#ec4899" />
      <text x="18" y="10" fill="#f1f5f9" font-size="12" font-weight="600">HTML5 &amp; CSS3</text>
      <text x="130" y="10" fill="#94a3b8" font-size="11.5" font-weight="500" class="mono">9.5%</text>
    </g>
    <!-- Java / SQL / Other -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="4.5" fill="#8b5cf6" />
      <text x="18" y="10" fill="#f1f5f9" font-size="12" font-weight="600">Java &amp; SQL</text>
      <text x="130" y="10" fill="#94a3b8" font-size="11.5" font-weight="500" class="mono">5.5%</text>
    </g>
    <!-- AI Workflows -->
    <g transform="translate(0, 64)">
      <circle cx="6" cy="6" r="4.5" fill="#10b981" />
      <text x="18" y="10" fill="#f1f5f9" font-size="12" font-weight="600">AI / N8N Pipelines</text>
      <text x="130" y="10" fill="#34d399" font-size="11.5" font-weight="700" class="mono">Active</text>
    </g>
  </g>
</svg>